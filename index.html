<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#f5f7fa"><title>間取りデザイナー</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f5f7fa;color:#192536}header{padding:14px 16px;background:white;border-bottom:1px solid #dce3ec}h1{font-size:19px;margin:0}small{color:#64748b}.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px}button,select,input{font:inherit}button{background:#1769d2;color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:600;min-height:44px}button.secondary{background:#e4eaf3;color:#243247}button.danger{background:#b43a3a}.workspace{margin:0 12px;background:white;border:1px solid #cbd5e1;border-radius:12px;overflow:hidden;position:relative}#plan{display:block;width:100%;height:min(62vh,650px);touch-action:none;background-color:#fff;background-image:linear-gradient(#e8edf3 1px,transparent 1px),linear-gradient(90deg,#e8edf3 1px,transparent 1px);background-size:24px 24px}.room{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.room.selected{fill:#bfdbfe;stroke:#0c4a9e;stroke-width:3}.handle{fill:#0c4a9e;stroke:white;stroke-width:2}.label{fill:#172b4d;font-weight:600;font-size:14px;pointer-events:none}.hint{padding:10px 14px;color:#526178;font-size:13px}.editor{margin:12px;padding:14px;background:white;border:1px solid #dce3ec;border-radius:12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fields label{display:grid;gap:4px;font-size:13px}.fields input,.fields select{width:100%;padding:10px;border:1px solid #aab8c9;border-radius:8px;min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#status{font-size:13px;color:#475569;padding:0 14px 20px}
</style></head><body><header><h1>🏠 間取りデザイナー</h1><small>スマートフォン対応・試作版</small></header>
<div class="toolbar"><button id="add">＋ 部屋</button><button class="secondary" id="save">保存</button><button class="secondary" id="export">画像保存</button><button class="secondary" id="reset">初期化</button></div>
<div class="workspace"><svg id="plan" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" aria-label="間取り編集エリア"></svg></div><div class="hint">部屋を指でドラッグして移動。右下の青い丸をドラッグしてサイズ変更できます。</div>
<section class="editor"><strong>選択した部屋</strong><div class="fields" style="margin-top:12px"><label>部屋名<input id="name" placeholder="部屋を選択"></label><label>種類<select id="type"><option>LDK</option><option>洋室</option><option>寝室</option><option>玄関</option><option>土間</option><option>収納</option><option>水回り</option><option>その他</option></select></label><label>幅（目盛）<input id="width" type="number" min="2" max="30"></label><label>高さ（目盛）<input id="height" type="number" min="2" max="40"></label></div><div class="actions"><button id="remove" class="danger">選択した部屋を削除</button></div></section><p id="status" role="status"></p>
<script>
(()=>{'use strict';
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('plan'),$=id=>document.getElementById(id),step=12,limitW=360,limitH=520;
let rooms=[],selected=null,gesture=null,nextId=1;
const initial=[{id:1,name:'LDK',type:'LDK',x:24,y:36,w:240,h:192},{id:2,name:'土間',type:'土間',x:24,y:228,w:96,h:72},{id:3,name:'玄関',type:'玄関',x:120,y:228,w:96,h:72},{id:4,name:'洋室',type:'洋室',x:24,y:312,w:144,h:132}];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),snap=v=>Math.round(v/step)*step;
const valid=r=>r&&Number.isFinite(r.x)&&Number.isFinite(r.y)&&Number.isFinite(r.w)&&Number.isFinite(r.h)&&r.w>=24&&r.h>=24;
function persist(){try{localStorage.setItem('madori-v1',JSON.stringify({rooms,nextId}));}catch(e){status('保存できませんでした');}}
function status(t){$('status').textContent=t}
function el(tag,attrs){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n}
function draw(){svg.replaceChildren();rooms.forEach(r=>{let g=el('g',{'data-id':r.id});let rect=el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx:2,class:'room'+(selected===r.id?' selected':'')});g.append(rect);let t=el('text',{x:r.x+r.w/2,y:r.y+r.h/2,'text-anchor':'middle','dominant-baseline':'middle',class:'label'});t.textContent=r.name;g.append(t);if(selected===r.id){g.append(el('circle',{cx:r.x+r.w,cy:r.y+r.h,r:11,class:'handle','data-resize':'1'}));}svg.append(g)});syncEditor()}
function current(){return rooms.find(r=>r.id===selected)}
function syncEditor(){let r=current();for(let id of ['name','type','width','height']){$(id).disabled=!r} $('remove').disabled=!r;if(r){$('name').value=r.name;$('type').value=r.type;$('width').value=r.w/step;$('height').value=r.h/step}else{$('name').value='';$('width').value='';$('height').value=''}}
function add(){let i=rooms.length;let r={id:nextId++,name:'洋室'+(i+1),type:'洋室',x:snap(24+(i%5)*24),y:snap(48+(i%7)*36),w:120,h:96};rooms.push(r);selected=r.id;persist();draw();status('部屋を追加しました')}
function pos(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0}}
svg.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-id]');if(!g)return;const id=Number(g.getAttribute('data-id'));selected=id;const r=current(),p=pos(e);gesture={id,mode:e.target.hasAttribute('data-resize')?'resize':'move',start:p,x:r.x,y:r.y,w:r.w,h:r.h};svg.setPointerCapture(e.pointerId);draw()});
svg.addEventListener('pointermove',e=>{if(!gesture)return;const r=rooms.find(x=>x.id===gesture.id);if(!r)return;const p=pos(e),dx=p.x-gesture.start.x,dy=p.y-gesture.start.y;if(gesture.mode==='move'){r.x=clamp(snap(gesture.x+dx),0,limitW-r.w);r.y=clamp(snap(gesture.y+dy),0,limitH-r.h)}else{r.w=clamp(snap(gesture.w+dx),24,limitW-r.x);r.h=clamp(snap(gesture.h+dy),24,limitH-r.y)}draw()});
function finish(){if(gesture){gesture=null;persist();status('変更を保存しました')}}
svg.addEventListener('pointerup',finish);svg.addEventListener('pointercancel',finish);svg.addEventListener('lostpointercapture',finish);
$('add').onclick=add;$('save').onclick=()=>{persist();status('この端末のブラウザに保存しました')};
$('remove').onclick=()=>{if(!current())return;rooms=rooms.filter(r=>r.id!==selected);selected=null;persist();draw();status('部屋を削除しました')};
$('reset').onclick=()=>{if(!confirm('間取りを初期化しますか？'))return;rooms=initial.map(r=>({...r}));nextId=5;selected=null;persist();draw();status('初期化しました')};
$('name').addEventListener('input',e=>{let r=current();if(r){r.name=e.target.value.slice(0,24);persist();draw()}});
$('type').addEventListener('change',e=>{let r=current();if(r){r.type=e.target.value;persist();draw()}});
for(const [id,key,max] of [['width','w',limitW],['height','h',limitH]])$(id).addEventListener('change',e=>{let r=current();if(!r)return;let n=Number(e.target.value);if(!Number.isFinite(n))return;r[key]=clamp(snap(n*step),24,max-(key==='w'?r.x:r.y));persist();draw()});
$('export').onclick=()=>{const clone=svg.cloneNode(true);clone.setAttribute('width','720');clone.setAttribute('height','1040');clone.setAttribute('xmlns',NS);const style=el('style',{});style.textContent='.room{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.room.selected{fill:#bfdbfe;stroke:#0c4a9e;stroke-width:3}.handle{fill:#0c4a9e;stroke:white;stroke-width:2}.label{fill:#172b4d;font-weight:600;font-size:14px;font-family:sans-serif}';clone.prepend(style);const data=new XMLSerializer().serializeToString(clone),url=URL.createObjectURL(new Blob([data],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download='madori.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('SVG画像を書き出しました')};
try{const saved=JSON.parse(localStorage.getItem('madori-v1')||'null');if(saved&&Array.isArray(saved.rooms)){rooms=saved.rooms.filter(valid).slice(0,150);nextId=Math.max(1,...rooms.map(r=>r.id+1));}else{rooms=initial.map(r=>({...r}));nextId=5}}catch(e){rooms=initial.map(r=>({...r}));nextId=5}draw();status('部屋を選ぶか「＋ 部屋」を押してください');
})();
</script></body></html>

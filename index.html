<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#f5f7fa"><title>間取りデザイナー</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f5f7fa;color:#192536}header{padding:14px 16px;background:white;border-bottom:1px solid #dce3ec}h1{font-size:19px;margin:0}small{color:#64748b}.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px}button,select,input{font:inherit}button{background:#1769d2;color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:600;min-height:44px}button.secondary{background:#e4eaf3;color:#243247}button.danger{background:#b43a3a}.workspace{margin:0 12px;background:white;border:1px solid #cbd5e1;border-radius:12px;overflow:hidden;position:relative}#plan{display:block;width:100%;height:min(62vh,650px);touch-action:none;background-color:#fff;background-image:linear-gradient(#e8edf3 1px,transparent 1px),linear-gradient(90deg,#e8edf3 1px,transparent 1px);background-size:24px 24px}.room{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.room.selected{fill:#bfdbfe;stroke:#0c4a9e;stroke-width:3}.handle{fill:#0c4a9e;stroke:white;stroke-width:2}.label{fill:#172b4d;font-weight:600;font-size:14px;pointer-events:none}.hint{padding:10px 14px;color:#526178;font-size:13px}.editor{margin:12px;padding:14px;background:white;border:1px solid #dce3ec;border-radius:12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fields label{display:grid;gap:4px;font-size:13px}.fields input,.fields select{width:100%;padding:10px;border:1px solid #aab8c9;border-radius:8px;min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#status{font-size:13px;color:#475569;padding:0 14px 20px}
.metric{font-size:12px;fill:#36516e;pointer-events:none}.fixture{stroke:#0f766e;stroke-width:4;stroke-linecap:round;fill:none}.fixture.selected{stroke:#e8790c;stroke-width:5}.fixture-hit{stroke:transparent;stroke-width:22;fill:none}.fixture-handle{fill:#e8790c;stroke:white;stroke-width:2}.info{font-size:13px;color:#64748b;margin:8px 0}.toolbar button{flex-shrink:0}button:disabled{opacity:.45}
.viewtools{display:flex;align-items:center;gap:8px;padding:0 12px 10px;flex-wrap:wrap}.viewtools button{padding:8px 12px}.viewtools select{padding:10px;border-radius:9px;border:1px solid #b7c4d4;background:white}.dimension{font-size:10px;fill:#64748b;pointer-events:none}.compass{font-size:15px;fill:#be123c;font-weight:bold;pointer-events:none}.room{stroke-width:1.5}.wall-line{stroke:#334155;stroke-width:3;pointer-events:none}.opening-gap{stroke:white;stroke-width:7;pointer-events:none}.fixture.window{stroke:#0284c7}.fixture.door{stroke:#0f766e}.fixture.wall{stroke:#334155}.workspace{overflow:auto}#plan{transform-origin:top left}
</style></head><body><header><h1>🏠 間取りデザイナー</h1><small>スマートフォン対応・試作版</small></header>
<div class="toolbar"><button id="add">＋ 部屋</button><button id="addWall" class="secondary">＋ 壁</button><button id="addDoor" class="secondary">＋ ドア</button><button id="addWindow" class="secondary">＋ 窓</button><button class="secondary" id="save">保存</button><button class="secondary" id="export">画像保存</button><button class="secondary" id="reset">初期化</button></div>
<div class="viewtools"><button id="zoomOut" class="secondary">− 縮小</button><button id="zoomIn" class="secondary">＋ 拡大</button><button id="zoomReset" class="secondary">100%</button><label>方角 <select id="north"><option value="up">↑ 北</option><option value="right">→ 北</option><option value="down">↓ 北</option><option value="left">← 北</option></select></label></div><div class="workspace"><svg id="plan" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" aria-label="間取り編集エリア"></svg></div><div class="hint">部屋はドラッグで移動・右下でサイズ変更。壁・ドア・窓は線をドラッグして移動、端の丸で長さ変更。</div>
<section class="editor" id="fixtureEditor"><strong>壁・ドア・窓の設定</strong><div class="fields" style="margin-top:10px"><label>方向<select id="orientation"><option value="horizontal">横向き</option><option value="vertical">縦向き</option></select></label><label>ドア形式<select id="doorStyle"><option value="swing">開き戸</option><option value="sliding">引き戸</option></select></label><label>長さ（m）<input id="fixtureLength" type="number" min="0.6" max="9" step="0.3"></label><label>壁に吸着<select id="snapWall"><option value="on">ON</option><option value="off">OFF</option></select></label></div><p class="info">ドア・窓は近くの部屋境界へ吸着できます。開口部は簡易表現です。</p></section><section class="editor"><strong>選択した部屋</strong><div class="fields" style="margin-top:12px"><label>部屋名<input id="name" placeholder="部屋を選択"></label><label>種類<select id="type"><option>LDK</option><option>洋室</option><option>寝室</option><option>玄関</option><option>土間</option><option>収納</option><option>水回り</option><option>その他</option></select></label><label>幅（m）<input id="width" type="number" min="0.6" max="9" step="0.3"></label><label>奥行（m）<input id="height" type="number" min="0.6" max="13" step="0.3"></label></div><p class="info" id="areaInfo">1目盛＝0.3m／1畳＝1.62㎡（概算）</p><div class="actions"><button id="remove" class="danger">選択した部屋を削除</button></div></section><p id="status" role="status"></p>
<script>
(()=>{'use strict';
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('plan'),$=id=>document.getElementById(id),step=12,limitW=360,limitH=520;
let rooms=[],selected=null,gesture=null,nextId=1,fixtures=[],selectedFixture=null,nextFixtureId=1;const metersPerStep=0.3;let zoom=1,north="up",snapToWall=true;
const initial=[{id:1,name:'LDK',type:'LDK',x:24,y:36,w:240,h:192},{id:2,name:'土間',type:'土間',x:24,y:228,w:96,h:72},{id:3,name:'玄関',type:'玄関',x:120,y:228,w:96,h:72},{id:4,name:'洋室',type:'洋室',x:24,y:312,w:144,h:132}];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),snap=v=>Math.round(v/step)*step;
const valid=r=>r&&Number.isFinite(r.x)&&Number.isFinite(r.y)&&Number.isFinite(r.w)&&Number.isFinite(r.h)&&r.w>=24&&r.h>=24;
function persist(){try{localStorage.setItem('madori-v1',JSON.stringify({rooms,nextId,fixtures,nextFixtureId,north}));}catch(e){status('保存できませんでした');}}
function status(t){$('status').textContent=t}
function el(tag,attrs){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n}
function draw(){svg.replaceChildren();rooms.forEach(r=>{let g=el('g',{'data-id':r.id});let rect=el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx:2,class:'room'+(selected===r.id?' selected':'')});g.append(rect);let t=el('text',{x:r.x+r.w/2,y:r.y+r.h/2,'text-anchor':'middle','dominant-baseline':'middle',class:'label'});t.textContent=r.name;g.append(t);let metric=el('text',{x:r.x+r.w/2,y:r.y+r.h/2+18,'text-anchor':'middle',class:'metric'});metric.textContent=areaText(r);g.append(metric);if(selected===r.id){g.append(el('circle',{cx:r.x+r.w,cy:r.y+r.h,r:11,class:'handle','data-resize':'1'}));}svg.append(g)});drawSharedWalls();drawDimensions();fixtures.forEach(f=>{const g=el("g",{"data-fixture":f.id});let x2=f.x+(f.vertical?0:f.length),y2=f.y+(f.vertical?f.length:0);g.append(el("line",{x1:f.x,y1:f.y,x2,y2,class:"fixture-hit"}));if(f.kind!=="wall"&&f.attached){g.append(el("line",{x1:f.x,y1:f.y,x2,y2,class:"opening-gap"}))}g.append(el("line",{x1:f.x,y1:f.y,x2,y2,class:"fixture "+f.kind+(selectedFixture===f.id?" selected":"")}));if(f.kind==="door"&&f.style!=="sliding"){const arc=el("path",{d:f.vertical?`M ${f.x} ${f.y} Q ${f.x+f.length*.65} ${f.y+f.length*.25} ${f.x+f.length} ${f.y+f.length}`:`M ${f.x} ${f.y} Q ${f.x+f.length*.25} ${f.y-f.length*.65} ${f.x+f.length} ${f.y-f.length}`,stroke:"#0f766e","stroke-width":1.5,fill:"none","stroke-dasharray":"3 3","pointer-events":"none"});g.append(arc)}if(f.kind==="door"&&f.style==="sliding"){g.append(el("line",{x1:f.x+(f.vertical?5:0),y1:f.y+(f.vertical?0:5),x2:x2+(f.vertical?5:0),y2:y2+(f.vertical?0:5),stroke:"#0f766e","stroke-width":2,"pointer-events":"none"}))}if(f.kind==="window"){g.append(el("line",{x1:f.x+(f.vertical?4:0),y1:f.y+(f.vertical?0:4),x2:x2+(f.vertical?4:0),y2:y2+(f.vertical?0:4),stroke:"#38bdf8","stroke-width":2,"pointer-events":"none"}))}if(selectedFixture===f.id)g.append(el("circle",{cx:x2,cy:y2,r:11,class:"fixture-handle","data-end":"1"}));svg.append(g)});const dirs={up:"↑",right:"→",down:"↓",left:"←"};let compass=el("text",{x:335,y:24,"text-anchor":"middle",class:"compass"});compass.textContent=dirs[north]+" N";svg.append(compass);syncEditor()}
function drawSharedWalls(){const edges=new Set();rooms.forEach(r=>{const parts=[[r.x,r.y,r.x+r.w,r.y],[r.x,r.y+r.h,r.x+r.w,r.y+r.h],[r.x,r.y,r.x,r.y+r.h],[r.x+r.w,r.y,r.x+r.w,r.y+r.h]];parts.forEach(p=>{const key=p.join(",");if(!edges.has(key)){edges.add(key);svg.append(el("line",{x1:p[0],y1:p[1],x2:p[2],y2:p[3],class:"wall-line"}))}})})}
function drawDimensions(){rooms.forEach(r=>{const t=el("text",{x:r.x+r.w/2,y:r.y-5,"text-anchor":"middle",class:"dimension"});t.textContent=(r.w/40).toFixed(1)+"m";svg.append(t);const side=el("text",{x:r.x-5,y:r.y+r.h/2,"text-anchor":"middle",class:"dimension",transform:"rotate(-90 "+(r.x-5)+" "+(r.y+r.h/2)+")"});side.textContent=(r.h/40).toFixed(1)+"m";svg.append(side)})}
function attachFixture(f){if(!snapToWall||f.kind==="wall"){f.attached=false;return}let candidates=[];rooms.forEach(r=>{if(f.vertical){for(let x of [r.x,r.x+r.w]){const yy=clamp(f.y,r.y,r.y+r.h-f.length);if(r.h>=f.length)candidates.push({dist:Math.abs(f.x-x)+Math.abs(f.y-yy),x,y:yy})}}else{for(let y of [r.y,r.y+r.h]){const xx=clamp(f.x,r.x,r.x+r.w-f.length);if(r.w>=f.length)candidates.push({dist:Math.abs(f.y-y)+Math.abs(f.x-xx),x:xx,y})}}});candidates.sort((a,b)=>a.dist-b.dist);if(candidates.length&&candidates[0].dist<=24){f.x=candidates[0].x;f.y=candidates[0].y;f.attached=true}else f.attached=false}
function areaText(r){const m2=(r.w/step*metersPerStep)*(r.h/step*metersPerStep);return m2.toFixed(1)+"㎡ / "+(m2/1.62).toFixed(1)+"畳"}function current(){return rooms.find(r=>r.id===selected)}
function syncEditor(){let r=current();let f=fixtures.find(x=>x.id===selectedFixture);$('fixtureEditor').style.display=f?'block':'none';if(f){$('orientation').value=f.vertical?'vertical':'horizontal';$('doorStyle').value=f.style||'swing';$('doorStyle').disabled=f.kind!=='door';$('fixtureLength').value=(f.length/40).toFixed(1)}for(let id of ['name','type','width','height']){$(id).disabled=!r} $('remove').disabled=!r&&selectedFixture===null;$('remove').textContent=selectedFixture!==null?'選択した壁・ドア・窓を削除':'選択した部屋を削除';$('areaInfo').textContent=r?'面積 '+areaText(r)+'（1畳＝1.62㎡で換算）':'1目盛＝0.3m／1畳＝1.62㎡（概算）';if(r){$('name').value=r.name;$('type').value=r.type;$('width').value=(r.w/step*metersPerStep).toFixed(1);$('height').value=(r.h/step*metersPerStep).toFixed(1)}else{$('name').value='';$('width').value='';$('height').value=''}}
function add(){let i=rooms.length;let r={id:nextId++,name:'洋室'+(i+1),type:'洋室',x:snap(24+(i%5)*24),y:snap(48+(i%7)*36),w:120,h:96};rooms.push(r);selected=r.id;selectedFixture=null;persist();draw();status('部屋を追加しました')}
function pos(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0}}
svg.addEventListener('pointerdown',e=>{const fg=e.target.closest('[data-fixture]');if(fg){const id=Number(fg.getAttribute('data-fixture')),f=fixtures.find(x=>x.id===id);selectedFixture=id;selected=null;const p=pos(e);gesture={id,mode:e.target.hasAttribute('data-end')?'fixture-resize':'fixture-move',start:p,x:f.x,y:f.y,length:f.length,vertical:f.vertical};svg.setPointerCapture(e.pointerId);draw();status('壁・ドア・窓を選択しました');return}const g=e.target.closest('[data-id]');if(!g){selected=null;selectedFixture=null;draw();return}const id=Number(g.getAttribute('data-id'));selected=id;selectedFixture=null;const r=current(),p=pos(e);gesture={id,mode:e.target.hasAttribute('data-resize')?'resize':'move',start:p,x:r.x,y:r.y,w:r.w,h:r.h};svg.setPointerCapture(e.pointerId);draw()});
svg.addEventListener('pointermove',e=>{if(!gesture)return;const p=pos(e),dx=p.x-gesture.start.x,dy=p.y-gesture.start.y;if(gesture.mode.startsWith('fixture-')){const f=fixtures.find(x=>x.id===gesture.id);if(!f)return;if(gesture.mode==='fixture-move'){f.x=clamp(snap(gesture.x+dx),0,limitW-(f.vertical?0:f.length));f.y=clamp(snap(gesture.y+dy),0,limitH-(f.vertical?f.length:0))}else{f.length=clamp(snap(gesture.length+(f.vertical?dy:dx)),24,(f.vertical?limitH-f.y:limitW-f.x))}f.attached=false;draw();return}const r=rooms.find(x=>x.id===gesture.id);if(!r)return;if(gesture.mode==='move'){r.x=clamp(snap(gesture.x+dx),0,limitW-r.w);r.y=clamp(snap(gesture.y+dy),0,limitH-r.h)}else{r.w=clamp(snap(gesture.w+dx),24,limitW-r.x);r.h=clamp(snap(gesture.h+dy),24,limitH-r.y)}draw()});
function finish(){if(gesture){if(gesture.mode.startsWith('fixture-')){const f=fixtures.find(x=>x.id===gesture.id);if(f)attachFixture(f)}gesture=null;persist();draw();status('変更を保存しました')}}
svg.addEventListener('pointerup',finish);svg.addEventListener('pointercancel',finish);svg.addEventListener('lostpointercapture',finish);
function addFixture(kind){const f={id:nextFixtureId++,kind,x:48,y:72+fixtures.length*36,length:kind==='wall'?120:72,vertical:false,style:'swing',attached:false};attachFixture(f);fixtures.push(f);selectedFixture=f.id;selected=null;persist();draw();status((kind==='wall'?'壁':kind==='door'?'ドア':'窓')+'を追加しました。線を指で移動できます')} $('addWall').onclick=()=>addFixture('wall');$('addDoor').onclick=()=>addFixture('door');$('addWindow').onclick=()=>addFixture('window');$('add').onclick=add;$('save').onclick=()=>{persist();status('この端末のブラウザに保存しました')};
$('remove').onclick=()=>{if(selectedFixture!==null){fixtures=fixtures.filter(f=>f.id!==selectedFixture);selectedFixture=null;persist();draw();status('設備を削除しました');return}if(!current())return;rooms=rooms.filter(r=>r.id!==selected);selected=null;persist();draw();status('部屋を削除しました')};
$('reset').onclick=()=>{if(!confirm('間取りを初期化しますか？'))return;rooms=initial.map(r=>({...r}));nextId=5;fixtures=[];nextFixtureId=1;selectedFixture=null;selected=null;north='up';$('north').value=north;persist();draw();status('初期化しました')};
$('orientation').onchange=e=>{const f=fixtures.find(x=>x.id===selectedFixture);if(!f)return;f.vertical=e.target.value==='vertical';f.length=Math.min(f.length,f.vertical?limitH-f.y:limitW-f.x);attachFixture(f);persist();draw()};
$('doorStyle').onchange=e=>{const f=fixtures.find(x=>x.id===selectedFixture);if(!f)return;f.style=e.target.value;persist();draw()};
$('fixtureLength').onchange=e=>{const f=fixtures.find(x=>x.id===selectedFixture);if(!f)return;const n=Number(e.target.value);if(!Number.isFinite(n))return;f.length=clamp(snap(n*40),24,f.vertical?limitH-f.y:limitW-f.x);attachFixture(f);persist();draw()};
$('snapWall').onchange=e=>{snapToWall=e.target.value==='on';const f=fixtures.find(x=>x.id===selectedFixture);if(f){attachFixture(f);persist();draw()}};
$('north').onchange=e=>{north=e.target.value;persist();draw()};
function setZoom(n){zoom=clamp(n,0.6,2.4);svg.style.width=(zoom*100)+'%';svg.style.height=(Math.min(window.innerHeight*.62,650)*zoom)+'px';status('表示倍率 '+Math.round(zoom*100)+'%')}
$('zoomIn').onclick=()=>setZoom(zoom+.2);$('zoomOut').onclick=()=>setZoom(zoom-.2);$('zoomReset').onclick=()=>setZoom(1);
$('name').addEventListener('input',e=>{let r=current();if(r){r.name=e.target.value.slice(0,24);persist();draw()}});
$('type').addEventListener('change',e=>{let r=current();if(r){r.type=e.target.value;persist();draw()}});
for(const [id,key,max] of [['width','w',limitW],['height','h',limitH]])$(id).addEventListener('change',e=>{let r=current();if(!r)return;let n=Number(e.target.value);if(!Number.isFinite(n))return;r[key]=clamp(snap(n/metersPerStep*step),24,max-(key==='w'?r.x:r.y));persist();draw()});
$('export').onclick=()=>{const clone=svg.cloneNode(true);clone.setAttribute('width','720');clone.setAttribute('height','1040');clone.setAttribute('xmlns',NS);const style=el('style',{});style.textContent='.metric{font-size:12px;fill:#36516e;font-family:sans-serif}.fixture{stroke:#0f766e;stroke-width:4;stroke-linecap:round;fill:none}.fixture.selected{stroke:#e8790c;stroke-width:5}.fixture-hit{stroke:transparent;stroke-width:22}.fixture-handle{fill:#e8790c;stroke:white;stroke-width:2}.room{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.room.selected{fill:#bfdbfe;stroke:#0c4a9e;stroke-width:3}.handle{fill:#0c4a9e;stroke:white;stroke-width:2}.label{fill:#172b4d;font-weight:600;font-size:14px;font-family:sans-serif}';clone.prepend(style);const data=new XMLSerializer().serializeToString(clone),url=URL.createObjectURL(new Blob([data],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download='madori.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('SVG画像を書き出しました')};
try{const saved=JSON.parse(localStorage.getItem('madori-v1')||'null');if(saved&&Array.isArray(saved.rooms)){rooms=saved.rooms.filter(valid).slice(0,150);nextId=Math.max(1,...rooms.map(r=>r.id+1));fixtures=Array.isArray(saved.fixtures)?saved.fixtures.filter(f=>f&&['wall','door','window'].includes(f.kind)&&Number.isFinite(f.x)&&Number.isFinite(f.y)&&Number.isFinite(f.length)&&typeof f.vertical==='boolean').slice(0,100):[];nextFixtureId=Math.max(1,...fixtures.map(f=>f.id+1));north=['up','right','down','left'].includes(saved.north)?saved.north:'up';$('north').value=north;}else{rooms=initial.map(r=>({...r}));nextId=5}}catch(e){rooms=initial.map(r=>({...r}));nextId=5}draw();status('部屋を選ぶか「＋ 部屋」を押してください');
})();
</script></body></html>
